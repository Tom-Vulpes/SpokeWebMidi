<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shared Color</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #bg {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center;
    background-color: #FF6B5B;
    transition: background-color 0.6s ease;
  }
  #status {
    color: rgba(255,255,255,0.85);
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    font-size: 14px;
    margin-bottom: 16px;
    min-height: 20px;
  }
  #swatches { display: flex; gap: 20px; padding-bottom: 40px; }
  .swatch {
    width: 64px; height: 64px;
    border-radius: 14px;
    border: 3px solid rgba(255,255,255,0.6);
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .swatch:hover { transform: translateY(-4px) scale(1.05); }
  .swatch:active { transform: translateY(0) scale(0.96); }
  .swatch.selected {
    border-color: white;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.9), 0 8px 20px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>

<div id="bg">
  <div id="status">Connecting…</div>
  <div id="swatches"></div>
</div>

<!-- Firebase SDK (compat version — simplest to drop in, no build step) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
  // === 1. PASTE YOUR FIREBASE CONFIG HERE ===
  const firebaseConfig = {
    apiKey: "AIzaSyCbr-Rx7M89ANVZXFxbLteyMnJGZ4Aj8QQ",
    authDomain: "umbrella-4add5.firebaseapp.com",
    databaseURL: "https://umbrella-4add5-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "umbrella-4add5",
    storageBucket: "umbrella-4add5.firebasestorage.app",
    messagingSenderId: "860172090910",
    appId: "1:860172090910:web:ac793d6d96bc8cfe7e380f"
  };
  // ============================================

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const colorRef = db.ref("sharedColor");

  const COLORS = [
    { name: "Coral",  hex: "#FF6B5B" },
    { name: "Teal",   hex: "#2EC4B6" },
    { name: "Violet", hex: "#7B61FF" },
    { name: "Amber",  hex: "#FFB627" }
  ];

  const bgEl = document.getElementById("bg");
  const statusEl = document.getElementById("status");
  const swatchesEl = document.getElementById("swatches");

  function applyColor(hex) {
    bgEl.style.backgroundColor = hex;
    document.querySelectorAll(".swatch").forEach(s => {
      s.classList.toggle("selected", s.dataset.hex === hex);
    });
  }

  function buildSwatches() {
    COLORS.forEach(c => {
      const div = document.createElement("div");
      div.className = "swatch";
      div.style.backgroundColor = c.hex;
      div.dataset.hex = c.hex;
      div.title = c.name;
      div.addEventListener("click", () => {
        colorRef.set(c.hex).catch(err => {
          console.error(err);
          statusEl.textContent = "Couldn't save — check your Firebase rules";
        });
      });
      swatchesEl.appendChild(div);
    });
  }

  // Live listener — fires instantly for every visitor whenever the value changes
  colorRef.on("value", (snapshot) => {
    const hex = snapshot.val();
    if (hex) {
      applyColor(hex);
      statusEl.textContent = "Live";
    } else {
      // No value set yet — seed it with the first color
      colorRef.set(COLORS[0].hex);
    }
  }, (err) => {
    console.error(err);
    statusEl.textContent = "Connection error — check console";
  });

  buildSwatches();
</script>

</body>
</html>
